services:
  - type: web
    name: monthly-report
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: FIGMA_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GA4_PROPERTY_ID
        sync: false
      - key: FIGMA_FILE_KEY
        sync: false
      - key: CLIENT_NAME
        sync: false
      - key: IS_CLOUD
        value: "true"
